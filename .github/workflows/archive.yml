name: Archive monthly outlook and check fires and weather

on:
  schedule:
    # Times are UTC.
    # Weather, ERC/BI, fires and scores: every day at 03:00 UTC (8 pm MST / 9 pm MDT the evening before).
    - cron: "0 3 * * *"
    # Monthly outlook: the 1st at 20:00 UTC (1 pm MST / 2 pm MDT); the 2nd and 3rd are backups that
    # only run if the new month's outlook still isn't saved.
    - cron: "0 20 1-3 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-save this month's outlook even if it hasn't changed"
        type: boolean
        default: false
      rebuild:
        description: "Re-check every saved station day with each GACC's current settings"
        type: boolean
        default: false
      backfill_all:
        description: "One time: gather all weather and fire starts back to the first archived outlook"
        type: boolean
        default: false
      backfill_from:
        description: "Backfill station weather and new-start counts from this date (YYYY-MM-DD)"
        type: string
        default: ""
      backfill_to:
        description: "...up to this date (YYYY-MM-DD; blank = yesterday). Do a few months per run."
        type: string
        default: ""
      refresh_fires:
        description: "Re-read every past year of fire records"
        type: boolean
        default: false
      import_archive:
        description: "Load past outlooks from the NIFC archive: a year or range (e.g. 2023-2026), or 'all'"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save the monthly outlook (all GACCs) and the NIFC maps
        id: outlook
        if: github.event_name != 'schedule' || github.event.schedule == '0 20 1-3 * *'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python scripts/archive_outlook.py --only-if-missing
          else python scripts/archive_outlook.py ${{ inputs.force && '--force' || '' }}; fi

      - name: Load past outlooks from the NIFC archive
        id: archive
        if: inputs.import_archive != ''
        continue-on-error: true
        run: |
          if [ "${{ inputs.import_archive }}" = "all" ]; then python scripts/import_archive.py
          else python scripts/import_archive.py --years "${{ inputs.import_archive }}"; fi

      - name: Station weather, ERC and BI, neighbor checks
        if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
        id: weather
        continue-on-error: true
        run: |
          ARGS=""
          if [ "${{ inputs.backfill_all }}" = "true" ]; then ARGS="--backfill-all"; fi
          if [ -n "${{ inputs.backfill_from }}" ]; then ARGS="$ARGS --from ${{ inputs.backfill_from }}"; fi
          if [ -n "${{ inputs.backfill_from }}" ] && [ -n "${{ inputs.backfill_to }}" ]; then ARGS="$ARGS --to ${{ inputs.backfill_to }}"; fi
          if [ "${{ inputs.rebuild }}" = "true" ]; then ARGS="$ARGS --rebuild"; fi
          python scripts/station_weather.py $ARGS

      - name: Significant fires per PSA per month, and normal (WFIGS)
        if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
        id: history
        continue-on-error: true
        run: python scripts/fire_history.py ${{ inputs.refresh_fires && '--refresh-all' || '' }}

      - name: Nightly fire growth and new starts (WFIGS)
        if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
        id: fires
        continue-on-error: true
        run: python scripts/update_fires.py ${{ inputs.backfill_all && '--backfill-all' || '' }} ${{ inputs.backfill_from && format('--starts-from {0}', inputs.backfill_from) || '' }}

      - name: Score the outlooks
        id: verify
        continue-on-error: true
        run: python scripts/verify_outlook.py

      - name: Commit results
        run: |
          git config user.name  "outlook-archiver"
          git config user.email "actions@users.noreply.github.com"
          git add data/ config/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Archive $(TZ=America/Denver date +%F)"
            git pull --rebase --quiet
            git push
          fi

      - name: Flag any failed step
        if: steps.outlook.outcome == 'failure' || steps.weather.outcome == 'failure' || steps.history.outcome == 'failure' || steps.fires.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "Outlook: ${{ steps.outlook.outcome }}  Weather: ${{ steps.weather.outcome }}  Fire history: ${{ steps.history.outcome }}  Fire growth: ${{ steps.fires.outcome }}  Scores: ${{ steps.verify.outcome }}"
          exit 1
